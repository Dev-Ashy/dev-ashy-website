<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c7f688"/>
      <stop offset="55%" style="stop-color:#b8f36b"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121613"/>
      <stop offset="100%" style="stop-color:#0b0d0c"/>
    </linearGradient>
  </defs>

  <!-- Dark surface, hard 90-degree corners -->
  <rect x="20" y="20" width="200" height="200" fill="url(#bgGrad)"/>

  <!-- Terminal prompt line -->
  <path d="M52 56h56" stroke="#4ade80" stroke-width="4" stroke-linecap="square" opacity="0.85"/>

  <!-- Hairline border (focused window) -->
  <rect x="20" y="20" width="200" height="200" fill="none" stroke="url(#logoGrad)" stroke-width="6"/>

  <!-- D glyph -->
  <text x="120" y="172" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="150" font-weight="700" letter-spacing="-14" fill="url(#logoGrad)" text-anchor="middle">D</text>

  <!-- Cursor block after the D -->
  <rect x="152" y="112" width="26" height="34" fill="#b8f36b">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>