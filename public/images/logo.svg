<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="none" stroke="url(#logoGrad)" stroke-width="3" filter="url(#glow)"/>
  <text x="100" y="135" font-family="monospace" font-size="100" font-weight="bold" fill="url(#logoGrad)" text-anchor="middle">D</text>
  <circle cx="160" cy="40" r="8" fill="#22d3ee"/>
</svg>
